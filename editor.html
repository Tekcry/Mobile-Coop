<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kestrel Level Editor</title>
    <style>
      :root {
        --bg: #1d2126;
        --panel: #262b31;
        --line: #3a4048;
        --ink: #e8eaed;
        --dim: #9aa3ad;
        --accent: #ff7300;
        --bad: #ff5a5a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, Segoe UI, Arial, sans-serif; overflow: hidden; }
      body { display: flex; flex-direction: column; }
      #bar { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
      #bar .line { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      #bar .title { font-weight: 700; margin-right: 6px; }
      #bar .group { display: inline-flex; gap: 2px; align-items: center; }
      #bar .seg button { border-radius: 0; margin-left: -1px; }
      #bar .seg button:first-child { border-radius: 4px 0 0 4px; }
      #bar .seg button:last-child { border-radius: 0 4px 4px 0; }
      button, select, input { font: inherit; color: var(--ink); background: #343a42; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
      input[type='range'] { padding: 0; width: 90px; vertical-align: middle; }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.45; }
      button.on { background: var(--accent); border-color: var(--accent); color: #111; }
      details.pick { position: relative; }
      details.pick summary { cursor: pointer; list-style: none; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: #343a42; }
      details.pick[open] summary, details.pick.on summary { border-color: var(--accent); }
      details.pick .menu { position: absolute; z-index: 20; top: 100%; left: 0; margin-top: 2px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; }
      details.pick label { display: block; }
      #checksBadge { margin-left: auto; cursor: pointer; color: var(--dim); }
      .bad { color: var(--bad); }
      .dim { color: var(--dim); }
      main { flex: 1; min-height: 0; display: flex; position: relative; }
      #stage { --split: 58%; position: relative; flex: 1; min-width: 0; display: flex; }
      #stage[data-split='col'] { flex-direction: column; }
      #view3d { position: relative; flex: 0 0 var(--split); min-width: 0; min-height: 0; }
      #divider { flex: none; width: 6px; cursor: col-resize; background: var(--line); }
      #stage[data-split='col'] #divider { width: auto; height: 6px; cursor: row-resize; }
      #divider:hover { background: var(--accent); }
      #planWrap { position: relative; flex: 1; min-width: 0; min-height: 0; background: #fff; overflow: hidden; }
      #stage[data-swap='1'] #view3d { order: 3; }
      #stage[data-swap='1'] #divider { order: 2; }
      #stage[data-swap='1'] #planWrap { order: 1; }
      #stage[data-layout='3d'] #view3d { flex: 1; }
      #stage[data-layout='3d'] #divider, #stage[data-layout='3d'] #planWrap { display: none; }
      #stage[data-layout='3d'][data-minimap='1'] #planWrap { display: block; position: absolute; z-index: 5; left: 8px; bottom: 34px; width: 280px; height: 210px; border: 2px solid var(--line); border-radius: 6px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5); }
      #stage[data-layout='plan'] #view3d { flex: 0 0 0; visibility: hidden; }
      #stage[data-layout='plan'] #divider { display: none; }
      #c { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #hud { position: absolute; left: 8px; top: 8px; padding: 2px 8px; background: rgba(0, 0, 0, 0.55); border-radius: 4px; pointer-events: none; white-space: pre; }
      #hud:empty { display: none; }
      /* the hub (ED3-2): full-screen, pause-style; text at least 20 px; --ts is the Large text setting */
      #hub { position: fixed; z-index: 28; inset: 0; overflow: auto; background: rgba(10, 12, 15, 0.94); color: var(--ink); font-size: calc(20px * var(--ts, 1)); }
      #hubInner { max-width: 1500px; margin: 0 auto; padding: 24px 32px; }
      .hub-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
      .hub-tabs button { font-size: calc(22px * var(--ts, 1)); padding: 8px 18px; border-radius: 8px; }
      .hub-tabs button.on { background: var(--accent); color: #fff; border-color: #fff; }
      .hub-keys { margin: 10px 0 14px; }
      .hub-row { display: flex; align-items: baseline; gap: 16px; padding: 10px 14px; margin: 4px 0; border: 2px solid transparent; border-radius: 8px; background: rgba(40, 45, 52, 0.7); cursor: pointer; }
      .hub-row b { color: var(--accent); margin-left: auto; }
      .hub-row small { color: var(--dim); font-size: calc(18px * var(--ts, 1)); }
      .hub-row.line { background: rgba(30, 34, 40, 0.6); }
      .hub-row.off { opacity: 0.45; cursor: default; }
      .hub-row.bad span { color: #ff6b6b; }
      #hub .padfocus { border-color: #fff; background: rgba(10, 132, 255, 0.35); }
      #hubPanel .row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin: 6px 0; }
      #hub h4 { margin: 18px 0 4px; color: var(--dim); font-weight: 600; }
      #hubPanel button, #hubPanel input { font-size: calc(20px * var(--ts, 1)); }
      #hubPanel .row input[type='checkbox'] { flex: none; width: 22px; height: 22px; }
      #hubPanel .row input[type='range'] { flex: none; width: 260px; }
      #hubPanel .row > span:first-child { width: 160px; }
      #padPicture { display: block; width: 100%; height: auto; margin: 6px 0 14px; }
      #helpTable h4 { margin: 12px 0 2px; color: var(--dim); }
      #helpTable td { padding: 2px 10px 2px 0; vertical-align: top; }
      #helpTable td:first-child { color: var(--accent); white-space: nowrap; }
      #helpTable td.pad { color: #7cc4ff; white-space: nowrap; }
      /* the magnetic dot: one pulse on a new snap; red where A cannot place */
      #reticle.pulse::before { animation: dotPulse 0.3s ease-out; }
      @keyframes dotPulse { 50% { transform: scale(1.8); } }
      #reticle.bad::before { border-color: #ff3b30; box-shadow: 0 0 0 2px #ff3b30; }
      #reticle.bad #reticleText { color: #ff8a80; }
      /* Large text: the pad screen and the wheels */
      #padStrip, #toolBar, #selCard, #reticleText, .rm-ring { zoom: var(--ts, 1); }
      .hidden { display: none !important; }
      #planSvg, #planSvg svg { width: 100%; height: 100%; display: block; }
      #planSvg text { pointer-events: none; }
      #planSvg [data-id] { cursor: pointer; }
      #planSvg rect.sel { stroke: var(--accent); stroke-width: 3; }
      #planSvg g.sel polygon { fill: var(--accent); }
      #planSvg .hov { stroke: #0a84ff; stroke-width: 3; }
      #planSvg .gone { display: none; }
      #planStatus { position: absolute; left: 6px; bottom: 30px; color: #333; background: rgba(255, 255, 255, 0.85); padding: 0 4px; pointer-events: none; }
      #hint { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; padding: 4px 10px; background: rgba(15, 17, 20, 0.82); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
      #hint b { color: var(--accent); font-weight: 600; }
      #hint .note { color: #ffd166; }
      #drawer { display: flex; flex-direction: column; width: 360px; flex: none; background: var(--panel); border-left: 1px solid var(--line); }
      body[data-drawer='open'] #drawer { position: absolute; z-index: 10; right: 0; top: 0; bottom: 0; box-shadow: -4px 0 16px rgba(0, 0, 0, 0.45); }
      body[data-drawer='closed'] #drawer { display: none; }
      #drawerHead { display: flex; gap: 2px; padding: 4px 6px 0; align-items: center; }
      #drawerHead button { border-bottom: none; border-radius: 4px 4px 0 0; }
      #drawerHead .grow { flex: 1; }
      #panel { flex: 1; overflow: auto; padding: 8px 10px; border-top: 1px solid var(--line); }
      .row { display: flex; gap: 8px; align-items: center; margin: 3px 0; }
      .row > span:first-child { width: 96px; color: var(--dim); flex: none; }
      .row input, .row select { flex: 1; min-width: 0; }
      .list { margin: 0; padding-left: 16px; }
      .list li { margin: 3px 0; }
      #ask { position: absolute; z-index: 30; left: 50%; top: 12px; transform: translateX(-50%); padding: 10px 14px; background: var(--panel); border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); }
      #ask button { margin-left: 8px; }
      #radial { position: absolute; z-index: 25; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.25); pointer-events: none; }
      .rm-ring { position: relative; width: min(62vh, 560px); height: min(62vh, 560px); border-radius: 50%; background: radial-gradient(circle, rgba(15, 17, 20, 0.88) 0 34%, rgba(15, 17, 20, 0.55) 35% 68%, transparent 69%); }
      .rm-slot { position: absolute; transform: translate(-50%, -50%); min-width: 104px; max-width: 140px; padding: 10px 12px; text-align: center; font-size: 15px; font-weight: 600; color: var(--ink); background: rgba(40, 45, 52, 0.95); border: 2px solid var(--line); border-radius: 12px; transition: transform 0.08s; }
      .rm-slot.hl { transform: translate(-50%, -50%) scale(1.18); background: var(--accent); border-color: #fff; color: #111; }
      .rm-sub { margin-left: 4px; }
      .rm-centre { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36%; text-align: center; }
      .rm-crumb { color: var(--dim); font-size: 13px; }
      .rm-name { font-size: 20px; font-weight: 700; color: var(--accent); }
      .rm-desc { color: var(--ink); font-size: 13px; }
      #reticle { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 3; }
      #reticle::before { content: ''; position: absolute; left: -9px; top: -9px; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }
      #reticleText { position: absolute; left: 16px; top: 12px; white-space: nowrap; padding: 2px 8px; background: rgba(0, 0, 0, 0.7); color: #fff; border-radius: 4px; font-size: 14px; }
      /* pad screen (ED3-1): tool bar bottom centre above the button prompts, selection card bottom right */
      #toolBar, #selCard { display: none; position: absolute; z-index: 4; pointer-events: none; background: rgba(15, 17, 20, 0.85); border-radius: 8px; }
      #toolBar { left: 50%; transform: translateX(-50%); bottom: 64px; gap: 6px; padding: 6px; }
      #toolBar .slot { min-width: 88px; padding: 6px 10px; border-radius: 6px; text-align: center; font-size: 20px; color: var(--dim); }
      #toolBar .slot b { display: block; font-weight: 600; }
      #toolBar .slot small { display: block; font-size: 14px; }
      #toolBar .slot.on { background: var(--accent); color: #fff; }
      #toolBar.compact { gap: 2px; padding: 4px; }
      #toolBar.compact .slot { min-width: 0; padding: 4px 7px; font-size: 16px; }
      #toolBar.compact .slot small { font-size: 12px; }
      #selCard { right: 8px; bottom: 64px; padding: 10px 14px; font-size: 20px; line-height: 1.4; max-width: 420px; }
      #selCard b { color: var(--accent); }
      #selCard small.id { color: var(--dim); font-size: 0.7em; margin-left: 4px; }
      body[data-device='pad'] #toolBar:not(.hidden) { display: flex; }
      body[data-device='pad'] #selCard:not(.hidden) { display: block; }
      .padfocus { outline: 3px solid var(--accent) !important; outline-offset: -3px; }
      #panel .padfocus { outline-offset: 1px; }
      #planSvg.nolabels text { display: none; }
      body:has(#radial:not(.hidden)) #reticle { display: none; }
      #ask div { margin-bottom: 8px; max-width: 420px; }
      #padStrip { display: none; position: absolute; z-index: 4; left: 8px; top: 8px; padding: 8px 12px; background: rgba(15, 17, 20, 0.85); border-radius: 8px; font-size: 18px; line-height: 1.5; pointer-events: none; }
      #padStrip b { color: var(--accent); }
      body[data-device='pad'] { cursor: none; }
      body[data-device='pad'] #bar, body[data-device='pad'] #hud { display: none; }
      body[data-device='pad'] #drawer:not(.padfocus) { display: none; }
      body[data-device='pad'] #padStrip { display: block; }
      body[data-device='pad'] #hint { font-size: 20px; text-align: center; padding: 8px 12px; }
      /* the small plan clears the controller's taller hint bar (ED3-pad1) */
      body[data-device='pad'] #stage[data-layout='3d'][data-minimap='1'] #planWrap { bottom: 52px; }
      body[data-device='pad'] #status { font-size: 16px; height: auto; }
      body[data-device='pad'] #drawer { width: 460px; font-size: 18px; }
      body[data-device='pad'] #panel .row { margin: 8px 0; }
      body[data-device='pad'] #panel input, body[data-device='pad'] #panel select, body[data-device='pad'] #panel button, body[data-device='pad'] #drawerHead button { font-size: 18px; padding: 6px 10px; }
      body[data-device='pad'] #reticleText { font-size: 18px; }
      body[data-device='pad'] #ask { font-size: 20px; padding: 16px 20px; }
      body[data-device='pad'] #ask button { font-size: 20px; padding: 8px 14px; }      /* phones and small windows (iPhone portrait and landscape): ED2 follow-up, Michael 2026-10-12 */
      body { height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-text-size-adjust: 100%; touch-action: manipulation; }
      @media (max-width: 900px), (max-height: 500px) {
        html, body { font-size: 13px; }
        #bar { padding: 4px 6px; gap: 2px; }
        #bar .line { flex-wrap: nowrap; overflow-x: auto; gap: 6px; scrollbar-width: none; }
        #bar .line > * { flex: none; }
        #bar .title, #checksBadge { display: none; }
        button, select { min-height: 34px; }
        #drawer, body[data-drawer='pinned'] #drawer { position: absolute; z-index: 10; right: 0; top: 0; bottom: 0; width: min(92vw, 420px); box-shadow: -4px 0 16px rgba(0, 0, 0, 0.45); }
        body[data-device='pad'] #drawer { width: min(92vw, 460px); }
        .rm-ring { width: min(88vmin, 560px); height: min(88vmin, 560px); }
        .rm-slot { min-width: 70px; max-width: 110px; padding: 7px 8px; font-size: 13px; }
        .rm-name { font-size: 16px; }
        .rm-desc, .rm-crumb { font-size: 11px; }
        #hint, body[data-device='pad'] #hint { font-size: 13px; padding: 4px 8px; }
        #padStrip { font-size: 13px; padding: 5px 8px; }
        body[data-device='pad'] #panel, body[data-device='pad'] #panel input, body[data-device='pad'] #panel select, body[data-device='pad'] #panel button { font-size: 15px; }
        #stage[data-layout='3d'][data-minimap='1'] #planWrap { width: min(38vw, 50vh); height: min(28vw, 37.5vh); min-width: 140px; min-height: 105px; bottom: 50px; }
        #reticleText, body[data-device='pad'] #reticleText { font-size: 13px; }
        #toolBar .slot { min-width: 0; font-size: 14px; padding: 4px 6px; }
        #selCard { font-size: 14px; max-width: 60vw; }
        #status { font-size: 12px; }
      }
      /* portrait: Both stacks the views */
      @media (max-aspect-ratio: 1/1) {
        #stage[data-split] { flex-direction: column; }
        #stage[data-split] #divider { width: auto; height: 6px; cursor: row-resize; }
      }      #status { flex: none; height: 24px; padding: 3px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
  </head>
  <body data-drawer="pinned">
    <header id="bar"></header>
    <main>
      <div id="stage" data-layout="both" data-split="row">
        <section id="view3d">
          <canvas id="c" tabindex="0"></canvas>
          <div id="hud"></div>
          <div id="reticle" class="hidden"><div id="reticleText"></div></div>
        </section>
        <div id="divider" title="Drag to resize"></div>
        <section id="planWrap"><div id="planSvg"></div><div id="planStatus"></div></section>
        <div id="hint"></div>
        <div id="padStrip"></div>
        <div id="toolBar" class="hidden"></div>
        <div id="selCard" class="hidden"></div>
        <div id="radial" class="hidden"></div>
      </div>
      <aside id="drawer">
        <div id="drawerHead"><button data-tab="props">Selected</button><button data-tab="checks">Checks</button><button data-tab="log">Changes</button><span class="grow"></span><button id="pin" title="Pin the panel beside the views, or let it float over them">Pin</button><button id="closeDrawer" title="Close (` or I)">x</button></div>
        <div id="panel"></div>
      </aside>
      <div id="ask" class="hidden"></div>
      <div id="hub" class="hidden"></div>
    </main>
    <div id="status">Loading the campus...</div>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>

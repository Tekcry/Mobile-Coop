name: Build and deploy to GitHub Pages

# The site holds the live game (default branch) at /<repo>/, the preview (dev branch) at /<repo>/preview/ and the
# Chaos Theory movement preview (ct-movement branch) at /<repo>/ct/ and the Kestrel map project (feature/kestrel branch)
# at /<repo>/kestrel/. A push to the default branch, or a passing "Preview check" on dev / ct-movement / feature/kestrel,
# rebuilds them all. Each slot is its own build, service worker and save database; the other slots are only rebuilt
# from their own branches.
# Releases (scripts/merge-train.mjs, audit 2026-10-24 finding 9): the merge commit carries the line
# "merge-train: Pages deploy is dispatched after dev moves", so neither its master push nor dev's Preview check deploys;
# after dev moves, merge-train dispatches this workflow once with tested_sha = the head CI passed on. When the live
# tree equals that head's tree, lint and vitest are skipped (CI already ran them on it). Each build writes
# version.json ({ version, sha }) into its slot; merge-train reads /preview/version.json to confirm the release.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: The commit CI passed on (a train head); lint and vitest are skipped when the live tree equals its tree
        required: false
        default: ''
      version:
        description: The released version (log only)
        required: false
        default: ''
  workflow_run:
    workflows: [Preview check]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'site' }}
  # the site deploy queues instead of cancelling: a release push and the dev workflow_run kept cancelling each other
  # (no Pages deploy 18:03-19:35 on 2026-10-24); pull requests still cancel their older run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # pull requests: check the change only (no deploy). lint, test, build-check and pr-size run in parallel; `check` is the
  # one status name merge-train and CLAUDE.md use, and it fails unless all four passed (a skipped need must not pass).
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test

  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build

  # PR size cap (intake gates, 2026-10-24; docs/systems/session-method.md "Intake"): <= 1500 changed lines vs the merge
  # base, excluding generated assets, snapshots, lockfiles and docs; train/* and docs-only PRs are exempt. Over the cap
  # it fails unless the PR has the `big-pr` label (orchestrator-approved). The label is read live, so after adding it
  # `gh run rerun <run id> --failed` reruns this job and `check`.
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR size (<= 1500 counted lines, or the big-pr label)
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        # The script (and its one local import) comes from the BASE branch, not the PR head: branches cut before the
        # gate existed lack scripts/pr-size.mjs. git still runs in the checkout, so the measured diff is unchanged.
        run: |
          mkdir -p "$RUNNER_TEMP/pr-size"
          for f in pr-size.mjs glob-match.mjs; do
            git show "origin/$BASE_REF:scripts/$f" > "$RUNNER_TEMP/pr-size/$f"
          done
          node "$RUNNER_TEMP/pr-size/pr-size.mjs" --base "origin/$BASE_REF" --head HEAD --branch "$HEAD_REF" --pr "$PR"

  check:
    needs: [lint, test, build-check, pr-size]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: All of lint, test, build-check and pr-size passed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build-check=${{ needs['build-check'].result }} pr-size=${{ needs['pr-size'].result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs['build-check'].result }}" = success
          test "${{ needs['pr-size'].result }}" = success

  build:
    if: >-
      github.event_name != 'pull_request'
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success'
          && !contains(github.event.workflow_run.head_commit.message, 'merge-train: Pages deploy is dispatched after dev moves')))
      && (github.event_name != 'push' || !contains(github.event.head_commit.message, 'merge-train: Pages deploy is dispatched after dev moves'))
    runs-on: ubuntu-latest
    env:
      # Pages serves project sites from /<repo-name>/
      BASE: /${{ github.event.repository.name }}/
      TESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.tested_sha || '' }}
    steps:
      - name: Live (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: live
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json
      - uses: actions/cache@v4
        id: nm
        with:
          path: live/node_modules
          key: nm-deploy-${{ runner.os }}-node22-${{ hashFiles('live/package-lock.json') }}
      - name: Install live
        if: steps.nm.outputs.cache-hit != 'true'
        working-directory: live
        run: npm ci
      - name: Lint and test live (skipped on a release dispatch whose tree CI already tested)
        working-directory: live
        run: |
          if [ -n "$TESTED_SHA" ] && git fetch --no-tags --depth=1 origin "$TESTED_SHA" && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "live tree == tree of the tested head $TESTED_SHA: lint and vitest skipped (CI passed on it)"
          else
            echo "no tested head, or the live tree differs from it: lint and vitest run"
            npm run lint
            npm test
          fi
      - name: Build live
        working-directory: live
        run: |
          VITE_BASE=$BASE npm run build
          node -e "const p=require('./package.json');require('fs').writeFileSync('dist/version.json',JSON.stringify({version:p.version,sha:require('child_process').execSync('git rev-parse HEAD').toString().trim()})+'\n')"
      - name: Is there a dev branch?
        id: dev
        run: |
          if git -C live ls-remote --exit-code --heads origin dev >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preview (dev branch)
        if: steps.dev.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: preview
      - name: Build preview into /preview/
        if: steps.dev.outputs.exists == 'true'
        working-directory: preview
        run: |
          # dev is normally master's merge commit: reuse live's node_modules (hard links) when the lockfile is the same
          if cmp -s package-lock.json ../live/package-lock.json; then cp -al ../live/node_modules node_modules; else npm ci; fi
          VITE_BASE=${BASE}preview/ VITE_PREVIEW=1 npm run build
          node -e "const p=require('./package.json');require('fs').writeFileSync('dist/version.json',JSON.stringify({version:p.version,sha:require('child_process').execSync('git rev-parse HEAD').toString().trim()})+'\n')"
          cp -r dist ../live/dist/preview
      - name: Is there a ct-movement branch?
        id: ct
        run: |
          if git -C live ls-remote --exit-code --heads origin ct-movement >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: CT preview (ct-movement branch)
        if: steps.ct.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: ct-movement
          path: ct
      - name: Build the CT preview into /ct/
        if: steps.ct.outputs.exists == 'true'
        working-directory: ct
        run: |
          npm ci
          VITE_BASE=${BASE}ct/ VITE_PREVIEW_ID=ct npm run build
          cp -r dist ../live/dist/ct
      - name: Is there a feature/kestrel branch?
        id: kestrel
        run: |
          if git -C live ls-remote --exit-code --heads origin feature/kestrel >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Kestrel preview (feature/kestrel branch)
        if: steps.kestrel.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: feature/kestrel
          path: kestrel
      - name: Build the Kestrel preview into /kestrel/
        if: steps.kestrel.outputs.exists == 'true'
        working-directory: kestrel
        run: |
          npm ci
          VITE_BASE=${BASE}kestrel/ VITE_PREVIEW_ID=kestrel npm run build
          cp -r dist ../live/dist/kestrel
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build and deploy to GitHub Pages

# The site is one build: the game (the default branch) at /<repo>/. A push to the default branch rebuilds and deploys it.
# The old /<repo>/preview/, /ct/ and /kestrel/ addresses are small static pages that forward to the game (keeping the
# ?query), written after the build by scripts/write-redirects.mjs. Each build writes version.json ({ version, sha }).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'site' }}
  # the site deploy queues instead of cancelling (two pushes in a row both deploy, in order); pull requests cancel their older run
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # pull requests: check the change only (no deploy). lint, test and build-check run in parallel; `check` is the one
  # status name to require, and it fails unless all three passed (a skipped need must not pass).
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm test

  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      # (map-ready S4) the campus prebake's folder (scripts/prebake.mjs): read only under the exact lamp key, so the
      # newest folder (restore-keys) bakes nothing when no lamp or level changed; outside node_modules (its own cache).
      # (prebake-preview) plain `prebake-` is the pre-variant fallback key
      - uses: actions/cache@v4
        with:
          path: .prebake-cache
          key: prebake-live-${{ hashFiles('src/**', 'scripts/prebake/**') }}
          restore-keys: |
            prebake-live-
            prebake-
      - run: npm run build

  check:
    needs: [lint, test, build-check]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: All of lint, test and build-check passed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} build-check=${{ needs['build-check'].result }}"
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs['build-check'].result }}" = success

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Pages serves project sites from /<repo-name>/
      BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-deploy-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint and test
        run: |
          npm run lint
          npm test
      - name: Campus prebake cache
        uses: actions/cache@v4
        with:
          path: .prebake-cache
          key: prebake-live-${{ hashFiles('src/**', 'scripts/prebake/**') }}
          restore-keys: |
            prebake-live-
            prebake-
      - name: Build
        run: |
          VITE_BASE=$BASE npm run build
          node -e "const p=require('./package.json');require('fs').writeFileSync('dist/version.json',JSON.stringify({version:p.version,sha:require('child_process').execSync('git rev-parse HEAD').toString().trim()})+'\n')"
      # the old /preview/, /ct/ and /kestrel/ addresses forward to the main game (scripts/write-redirects.mjs)
      - name: Forward the old slot addresses
        run: node scripts/write-redirects.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

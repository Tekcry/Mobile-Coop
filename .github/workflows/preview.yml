name: Preview check

# A push to dev, ct-movement or feature/kestrel is checked here; when it passes, "Build and deploy to GitHub Pages" rebuilds
# the site with the dev build under /preview/, the ct-movement build under /ct/ and the feature/kestrel build under /kestrel/
# (that workflow runs on the default branch, which the Pages environment allows).
on:
  push:
    branches: [dev, ct-movement, feature/kestrel]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # a merge-train release moves dev to a merge whose tree CI already tested; merge-train dispatches the one deploy
    # itself (deploy.yml, tested_sha), so this check and the deploy it would trigger are skipped for it
    if: "!contains(github.event.head_commit.message, 'merge-train: Pages deploy is dispatched after dev moves')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: nm
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm test

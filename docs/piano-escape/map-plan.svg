<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <title>Underhollow Store - bunker escape map plan (1 m = 20 px)</title>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="40" y="24" font-size="15" font-weight="bold" fill="#222">Underhollow Store - underground bunker, one level, 38 x 19 m, north up, 1 m = 20 px</text>

  <!-- spaces (cast concrete) -->
  <g fill="#ecebe7" stroke="#333" stroke-width="3">
    <rect x="40" y="140" width="480" height="280"/>
    <rect x="40" y="40" width="200" height="100"/>
    <rect x="240" y="92" width="480" height="48"/>
    <rect x="520" y="260" width="200" height="160"/>
    <rect x="520" y="140" width="200" height="120"/>
    <rect x="720" y="92" width="80" height="148"/>
  </g>
  <!-- stair treads and the exit zone (upper flight) -->
  <g stroke="#999" stroke-width="1">
    <line x1="730" y1="110" x2="790" y2="110"/><line x1="730" y1="122" x2="790" y2="122"/><line x1="730" y1="134" x2="790" y2="134"/><line x1="730" y1="146" x2="790" y2="146"/><line x1="730" y1="158" x2="790" y2="158"/>
  </g>
  <rect x="730" y="100" width="70" height="70" fill="#2e7d32" fill-opacity="0.12" stroke="#2e7d32" stroke-width="2" stroke-dasharray="5 3"/>

  <!-- doors (gaps) -->
  <g stroke="#ecebe7" stroke-width="5">
    <line x1="520" y1="328" x2="520" y2="360"/>
    <line x1="160" y1="140" x2="192" y2="140"/>
    <line x1="240" y1="104" x2="240" y2="128"/>
    <line x1="600" y1="140" x2="624" y2="140"/>
    <line x1="640" y1="260" x2="664" y2="260"/>
  </g>
  <line x1="720" y1="176" x2="720" y2="208" stroke="#2e7d32" stroke-width="7"/>
  <line x1="720" y1="104" x2="720" y2="128" stroke="#2e7d32" stroke-width="4"/>
  <text x="652" y="196" fill="#2e7d32" font-size="10">blast door</text>
  <text x="652" y="88" fill="#2e7d32" font-size="10">service door</text>

  <!-- timber crates: tall (2.4 m) and low (1.2 m) -->
  <g fill="#b9895a" stroke="#6d4c2a" stroke-width="1">
    <rect x="80" y="216" width="48" height="24"/>
    <rect x="300" y="206" width="48" height="24"/>
    <rect x="400" y="332" width="24" height="48"/>
  </g>
  <g fill="#ddc29f" stroke="#6d4c2a" stroke-width="1">
    <rect x="280" y="326" width="24" height="24"/>
    <rect x="120" y="356" width="24" height="24"/>
    <rect x="420" y="256" width="48" height="24"/>
    <rect x="210" y="166" width="24" height="24"/>
    <rect x="640" y="152" width="50" height="20"/>
  </g>
  <!-- plant, racks, lockers -->
  <g fill="#b0b0b0" stroke="#666" stroke-width="1">
    <rect x="60" y="70" width="80" height="50"/>
    <rect x="170" y="48" width="50" height="32"/>
    <rect x="560" y="354" width="120" height="16"/>
    <rect x="560" y="304" width="120" height="16"/>
    <rect x="524" y="180" width="16" height="60"/>
  </g>

  <!-- intro wall W1 (crate wall) -->
  <rect x="200" y="280" width="24" height="80" fill="#7a4a1e" stroke="#4a2c10"/>
  <text x="228" y="298" fill="#7a4a1e" font-weight="bold">W1</text>
  <text x="228" y="310" fill="#7a4a1e" font-size="10">crate wall</text>
  <text x="228" y="321" fill="#7a4a1e" font-size="10">(intro, 2.4 m)</text>

  <!-- lamps: caged bulkheads, all electric, all die at the EMP -->
  <g fill="#ffd54a" stroke="#a07800" stroke-width="1">
    <circle cx="120" cy="320" r="5"/><circle cx="280" cy="290" r="5"/><circle cx="440" cy="320" r="5"/><circle cx="120" cy="180" r="5"/><circle cx="280" cy="180" r="5"/><circle cx="440" cy="180" r="5"/>
    <circle cx="200" cy="110" r="4"/><circle cx="100" cy="52" r="4"/>
    <circle cx="340" cy="116" r="4"/><circle cx="480" cy="116" r="4"/><circle cx="660" cy="116" r="4"/>
    <circle cx="620" cy="336" r="4"/><circle cx="620" cy="282" r="4"/>
    <circle cx="580" cy="220" r="4"/><circle cx="680" cy="220" r="4"/>
    <circle cx="760" cy="196" r="4"/>
    <rect x="724" y="166" width="8" height="6"/>
  </g>

  <!-- guard patrols -->
  <g fill="none" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="80" y1="392" x2="360" y2="392"/>
    <polygon points="64,256 144,256 144,196 64,196"/>
    <polygon points="284,248 380,248 380,188 284,188"/>
    <line x1="490" y1="390" x2="490" y2="170"/>
    <line x1="260" y1="124" x2="700" y2="124"/>
    <line x1="260" y1="108" x2="700" y2="108"/>
    <polygon points="540,392 700,392 700,284 540,284"/>
  </g>
  <g stroke="#c62828" stroke-width="1" opacity="0.7">
    <line x1="590" y1="200" x2="612" y2="144"/>
    <line x1="590" y1="200" x2="652" y2="256"/>
  </g>

  <!-- intro: guards close in from two doors (slow motion) -->
  <g stroke="#e65100" stroke-width="2" stroke-dasharray="2 3" fill="none">
    <polyline points="560,344 520,344 292,374"/>
    <polyline points="560,344 520,344 322,292"/>
    <polyline points="180,100 176,140 176,166"/>
    <polyline points="180,100 176,140 248,208"/>
  </g>
  <text x="330" y="160" fill="#e65100" font-size="10">intro: guards close in from two doors</text>

  <!-- guard starts at the EMP -->
  <g fill="#c62828">
    <circle cx="290" cy="376" r="6"/><circle cx="176" cy="168" r="6"/><circle cx="320" cy="290" r="6"/><circle cx="250" cy="210" r="6"/>
    <circle cx="260" cy="124" r="6"/><circle cx="260" cy="108" r="6"/><circle cx="590" cy="200" r="6"/><circle cx="540" cy="392" r="6"/>
  </g>
  <g fill="#c62828" font-weight="bold">
    <text x="296" y="372">G1</text><text x="154" y="172">G2</text><text x="326" y="286">G3</text><text x="256" y="206">G4</text>
    <text x="268" y="102">G5+G6 pair</text><text x="598" y="196">G7 post</text><text x="546" y="388">G8</text>
  </g>

  <!-- players and intro camera -->
  <g fill="#2e7d32"><circle cx="192" cy="336" r="6"/><circle cx="192" cy="308" r="6"/></g>
  <text x="44" y="412" fill="#2e7d32" font-weight="bold">START: both players, backs to W1</text>
  <line x1="182" y1="322" x2="106" y2="322" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="100,322 110,317 110,327" fill="#6a1b9a"/>
  <text x="104" y="346" fill="#6a1b9a">intro pull-back</text>
  <text x="742" y="186" fill="#2e7d32" font-weight="bold">EXIT</text>
  <text x="736" y="232" fill="#2e7d32" font-size="10">stair up</text>

  <!-- labels -->
  <g fill="#333" font-weight="bold" font-size="12">
    <text x="300" y="412">STORE HALL (4.5 m)</text>
    <text x="48" y="136" font-size="10">PLANT ROOM (3.5 m)</text>
    <text x="400" y="136" font-size="10">SERVICE CORRIDOR (2.6 m)</text>
    <text x="580" y="412">SIDE STORE (3.2 m)</text>
    <text x="580" y="254" font-size="10">GUARD ROOM (2.8 m)</text>
    <text x="726" y="252" font-size="10">EAST STAIR</text>
  </g>
  <g fill="#555" font-size="10">
    <text x="84" y="232">T1</text><text x="316" y="222">T2</text><text x="404" y="360">T3</text>
    <text x="284" y="342">L1</text><text x="124" y="372">L2</text><text x="436" y="272">L3</text><text x="214" y="182">L4</text>
    <text x="72" y="98">generator</text><text x="174" y="68">fan</text><text x="590" y="350">rack R1</text><text x="590" y="300">rack R2</text>
    <text x="526" y="176">lockers</text><text x="648" y="166">desk</text>
  </g>

  <!-- scale bar and north -->
  <g stroke="#222" stroke-width="2">
    <line x1="40" y1="470" x2="240" y2="470"/>
    <line x1="40" y1="464" x2="40" y2="476"/><line x1="80" y1="466" x2="80" y2="474"/><line x1="120" y1="466" x2="120" y2="474"/><line x1="160" y1="466" x2="160" y2="474"/><line x1="200" y1="466" x2="200" y2="474"/><line x1="240" y1="464" x2="240" y2="476"/>
  </g>
  <text x="36" y="490">0</text><text x="112" y="490">4 m</text><text x="232" y="490">10 m</text>
  <g transform="translate(900,90)">
    <polygon points="0,-30 9,0 0,-6 -9,0" fill="#222"/>
    <text x="-5" y="16" font-weight="bold">N</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <circle cx="290" cy="468" r="5" fill="#ffd54a" stroke="#a07800"/><text x="300" y="472">caged lamp, all die at the EMP (16 + exit sign)</text>
    <rect x="284" y="484" width="14" height="10" fill="#b9895a" stroke="#6d4c2a"/><text x="304" y="493">tall timber crates (2.4 m)</text>
    <rect x="460" y="484" width="14" height="10" fill="#ddc29f" stroke="#6d4c2a"/><text x="480" y="493">low crates / desk (1.0-1.2 m)</text>
    <circle cx="290" cy="512" r="6" fill="#c62828"/><text x="300" y="516">guard start at the EMP (8)</text>
    <line x1="460" y1="512" x2="490" y2="512" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6 4"/><text x="496" y="516">fixed patrol</text>
    <rect x="284" y="526" width="14" height="10" fill="#b0b0b0" stroke="#666"/><text x="304" y="535">plant, racks, lockers</text>
    <circle cx="640" cy="468" r="6" fill="#2e7d32"/><text x="650" y="472">players' start / checkpoint</text>
    <line x1="632" y1="490" x2="652" y2="490" stroke="#2e7d32" stroke-width="6"/><text x="658" y="494">exit doors (open from inside)</text>
    <line x1="632" y1="512" x2="652" y2="512" stroke="#6a1b9a" stroke-width="2" stroke-dasharray="3 3"/><text x="658" y="516">intro camera path</text>
    <text x="632" y="535" fill="#555">No windows. If 8 torches fail the graphics test: G1, G4, G5, G6 only.</text>
  </g>
</svg>

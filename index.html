<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Night Shift" />
    <meta name="description" content="Mobile stealth shooter. Plays offline." />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <title>Night Shift</title>
  </head>
  <body>
    <canvas id="game" touch-action="none"></canvas>
    <div id="ui-root"></div>
    <!-- (menu-notes slice 4a, M2) the launch boot shows only the title's NIGHT / SHIFT wordmark, in the title's place from
         the first paint: the menu frame's scale (`uiScale` in src/core/display.ts, set again by App) before the bundle runs -->
    <script>
      document.documentElement.style.setProperty('--ui-scale', String(Math.round(Math.min(3, Math.max(1, Math.min(innerWidth / 1280, innerHeight / 720))) * 100) / 100));
    </script>
    <div id="boot" class="boot launch">
      <div class="boot-frame"><div class="boot-mark"><div class="ts-l1">Night</div><div class="ts-l2">Shift</div></div></div>
      <div class="boot-title"><span>NIGHT</span><span>SHIFT</span></div>
      <div class="boot-bar"><div id="boot-progress"></div></div>
      <div id="boot-status">Loading…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

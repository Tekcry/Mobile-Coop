<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Night Shift - Operator Lab (dev only)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #cfd8dc; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; outline: none; touch-action: none; }
  #ui { position: fixed; left: 0; top: 0; bottom: 0; width: 230px; background: rgba(8, 12, 14, 0.82); padding: 10px; overflow-y: auto; box-sizing: border-box; }
  body.clean #ui { display: none; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 12px 0 4px; color: #7f9aa3; }
  select, button { width: 100%; margin: 2px 0; background: #16222a; color: #cfd8dc; border: 1px solid #2c3f4a; padding: 4px; font: inherit; }
  button:hover { background: #1f313c; cursor: pointer; }
  button.on { background: #2a4a3a; }
  label { display: block; margin: 3px 0; }
  .row { display: flex; gap: 4px; }
  .row button { flex: 1; }
  #stats { margin-top: 10px; color: #7f9aa3; font-size: 11px; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>Operator Lab</h1>
  <div id="msg"></div>
  <h2>Operator</h2><select id="operator"></select>
  <h2>LOD</h2><select id="lod"></select>
  <h2>Preset</h2><select id="preset"></select>
  <h2>Lighting</h2><select id="rig"></select>
  <h2>Pose</h2><select id="pose"></select>
  <h2>View</h2>
  <div class="row"><button data-view="front">Front</button><button data-view="front34">3/4</button><button data-view="side">Side</button><button data-view="back34">3/4 B</button><button data-view="back">Back</button></div>
  <select id="closeup"></select>
  <label><input type="checkbox" id="turntable"> Turntable</label>
  <label><input type="checkbox" id="ortho"> Orthographic</label>
  <label><input type="checkbox" id="silhouette"> Scale bar and silhouette</label>
  <label><input type="checkbox" id="gameRig"> Current game operator beside</label>
  <h2>Debug</h2>
  <select id="debug"><option value="none">Shaded</option><option value="wire">Wireframe</option><option value="normals">Normals (bind space)</option><option value="uv">UVs</option><option value="matid">Material IDs</option></select>
  <div id="stats"></div>
</div>
<script type="module" src="/src/operators/lab/main.ts"></script>
</body>
</html>
